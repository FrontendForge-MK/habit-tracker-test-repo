<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prosty tracker codziennych nawyków do testowania workflow agentów."
    />
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Codzienny rytm</p>
        <h1>Małe kroki.<br />Każdego dnia.</h1>
        <p class="hero-copy">
          Dodaj nawyki, które chcesz utrzymać, i zaznaczaj wykonane.
        </p>
      </header>

      <section class="tracker-card" aria-labelledby="tracker-title">
        <div class="card-heading">
          <div>
            <p class="date-label" id="today-label"></p>
            <h2 id="tracker-title">Dzisiejsze nawyki</h2>
          </div>
          <p class="progress-label" id="progress-label" aria-live="polite">0 z 0</p>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-value" id="progress-value"></div>
        </div>

        <button class="reset-button" id="reset-button" type="button" disabled>
          Zacznij dzień od nowa
        </button>

        <form class="habit-form" id="habit-form">
          <label class="sr-only" for="habit-name">Nazwa nowego nawyku</label>
          <input
            id="habit-name"
            name="habitName"
            type="text"
            maxlength="60"
            placeholder="Np. 10 minut czytania"
            autocomplete="off"
            required
          />
          <button type="submit">Dodaj</button>
        </form>

        <p class="form-error" id="form-error" role="alert"></p>

        <ul class="habit-list" id="habit-list" aria-label="Lista nawyków"></ul>

        <div class="empty-state" id="empty-state">
          <span aria-hidden="true">&#10022;</span>
          <p>Nie masz jeszcze żadnych nawyków.</p>
          <small>Dodaj pierwszy powyżej.</small>
        </div>
      </section>
    </main>

    <template id="habit-template">
      <li class="habit-item">
        <label class="habit-check">
          <input type="checkbox" />
          <span class="checkmark" aria-hidden="true"></span>
          <span class="habit-title"></span>
        </label>
        <button class="delete-button" type="button">Usuń</button>
      </li>
    </template>

    <script src="date-utils.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
